# CI for the .NET plugin SDK.
#
# The library targets net8.0 for broad compatibility; the test project targets
# the current runtime, so `dotnet test` works on a machine with only the latest
# .NET installed. CI therefore installs both: 8.0 to run anything built against
# the library's own target, 10.0 for the tests.
#
# `-warnaserror` because the project sets `<Nullable>enable</Nullable>`, and a
# nullability warning in an SDK becomes a NullReferenceException in somebody
# else's plugin.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet restore HomeCoreSdk.csproj

      - name: Build the library
        run: dotnet build HomeCoreSdk.csproj --no-restore --configuration Release -warnaserror

      - name: Tests
        run: dotnet test tests/HomeCore.PluginSdk.Tests.csproj --configuration Release
